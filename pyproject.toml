[project]
name = "dream-job-radar"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.91",
    "dlt[filesystem]>=1.26.0",
    "duckdb>=1.5.2",
    "pyarrow>=24.0.0",
    "pyiceberg[pyarrow,s3fs]>=0.11.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dream_job_radar"]

[dependency-groups]
dev = []
